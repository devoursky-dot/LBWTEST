<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)" stroke="#3b82f6" stroke-width="16"/>
  <!-- 태블릿 화면 형태 -->
  <rect x="76" y="86" width="360" height="340" rx="36" fill="#131826" stroke="rgba(255,255,255,0.15)" stroke-width="8"/>
  <!-- 전자칠판 연결 신호 전파 파동 -->
  <circle cx="256" cy="190" r="28" fill="url(#accent)"/>
  <path d="M206 140 A70 70 0 0 1 306 140" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
  <path d="M176 110 A112 112 0 0 1 336 110" fill="none" stroke="#60a5fa" stroke-width="10" stroke-linecap="round" opacity="0.5"/>
  <!-- 필기 스타일러스 펜 -->
  <g transform="translate(256, 310) rotate(-45)">
    <rect x="-16" y="-80" width="32" height="120" rx="8" fill="#ffffff"/>
    <polygon points="-16,40 16,40 0,72" fill="#f59e0b"/>
    <circle cx="0" cy="72" r="3" fill="#0f172a"/>
    <rect x="-16" y="-60" width="32" height="20" fill="url(#accent)"/>
  </g>
  <!-- 텍스트 -->
  <text x="256" y="395" font-family="sans-serif" font-size="34" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="2">LBW NOTE</text>
